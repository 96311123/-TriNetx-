name: Update PubMed data

on:
  schedule:
    # 每週一 00:15 UTC = 台北時間 08:15
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch from PubMed and build outputs
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p docs/data cache
          python scripts/fetch_pubmed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data cache
          git add -A docs/data cache
          if git diff --cached --quiet; then
            echo "No changes."
          else
            n=$(python -c "import json;print(len(json.load(open('docs/data/articles.json'))))")
            git commit -m "data: weekly PubMed update ($(date -u +%F), ${n} articles)"
            git push
          fi
